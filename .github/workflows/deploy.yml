name: Deploy unified Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test, migrate, build, and deploy dx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check Web and Worker
        run: pnpm type-check
      - name: Test Worker
        run: pnpm test:worker
      - name: Validate SMTP configuration
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          for variable_name in SMTP_HOST SMTP_PORT SMTP_SECURITY SMTP_FROM_EMAIL SMTP_FROM_NAME SMTP_USER SMTP_PASSWORD; do
            if [ -z "${!variable_name}" ]; then
              echo "Required SMTP configuration is missing: ${variable_name}"
              exit 1
            fi
          done
          if [ "$SMTP_PORT" = "465" ] && [ "$SMTP_SECURITY" != "tls" ]; then
            echo "SMTP port 465 requires SMTP_SECURITY=tls"
            exit 1
          fi
          if [ "$SMTP_PORT" = "587" ] && [ "$SMTP_SECURITY" != "starttls" ]; then
            echo "SMTP port 587 requires SMTP_SECURITY=starttls"
            exit 1
          fi
          if [ "$SMTP_PORT" != "465" ] && [ "$SMTP_PORT" != "587" ]; then
            echo "SMTP_PORT must be 465 or 587"
            exit 1
          fi
      - name: Configure unified Worker bindings
        working-directory: apps/web
        run: |
          sed -i '/^\[env.production.vars\]/,/^\[/{s|AUTH_URL = ""|AUTH_URL = "${{ vars.AUTH_URL }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|CORS_ORIGIN = ""|CORS_ORIGIN = "${{ vars.AUTH_URL }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|FRONTEND_URL = ""|FRONTEND_URL = "${{ vars.AUTH_URL }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|SMTP_HOST = ""|SMTP_HOST = "${{ vars.SMTP_HOST }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|SMTP_PORT = ""|SMTP_PORT = "${{ vars.SMTP_PORT }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|SMTP_SECURITY = ""|SMTP_SECURITY = "${{ vars.SMTP_SECURITY }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|SMTP_FROM_EMAIL = ""|SMTP_FROM_EMAIL = "${{ vars.SMTP_FROM_EMAIL }}"|}' wrangler.toml
          sed -i '/^\[env.production.vars\]/,/^\[/{s|SMTP_FROM_NAME = ""|SMTP_FROM_NAME = "${{ vars.SMTP_FROM_NAME }}"|}' wrangler.toml
          sed -i '/^\[\[env.production.d1_databases\]\]/,/^\[/{s|database_id = ""|database_id = "${{ vars.D1_DATABASE_ID }}"|}' wrangler.toml
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: d1 migrations apply mlm-dx-db --env production --remote
          packageManager: pnpm
      - name: Build OpenNext unified Worker
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      - name: Deploy dx Worker
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production
          packageManager: pnpm
          environment: production
          secrets: |
            AUTH_SECRET
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            SMTP_USER
            SMTP_PASSWORD
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
