<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta name="robots" content="noindex, nofollow">
    <title>オフライン | MLM DX</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; background: #f3f4f6; color: #030712; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 24rem; padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: .75rem; background: #fff; }
      h1 { margin: 0 0 1.5rem; font-size: 1.5rem; line-height: 1.5; }
      small { display: block; margin-bottom: .5rem; font-size: 1rem; font-weight: normal; }
      button { min-height: 2.75rem; padding: .625rem 1rem; border: 0; border-radius: .375rem; background: #0f172a; color: #fff; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #0f172a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1><small>MLM DX</small>オフライン</h1>
      <button type="button" onclick="window.location.reload()">再読み込み</button>
    </main>
  </body>
</html>
